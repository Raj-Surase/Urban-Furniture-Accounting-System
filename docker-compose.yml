version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackathon_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - REALTIME_SERVER_URL=http://realtime:3001
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    networks:
      - hackathon_net

  realtime:
    build:
      context: ./realtime
      dockerfile: Dockerfile
    container_name: hackathon_realtime
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - CORS_ORIGIN=http://localhost:5173
    volumes:
      - ./realtime:/app
      - /app/node_modules
    networks:
      - hackathon_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackathon_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_SOCKET_URL=http://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
      - realtime
    networks:
      - hackathon_net

networks:
  hackathon_net:
    driver: bridge

